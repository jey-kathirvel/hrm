<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102451">
  <title>ADS HRM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="/static/css/standalone.css?v=3">
  <link rel="stylesheet" href="/static/css/ads-hrm.css?v=3">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark hrm-nav">

  <a class="navbar-brand" href="/hrm">
    <span class="brand-mark">
      <i class="fas fa-users-cog"></i>
    </span>

    <span class="brand-copy">
      <strong>ADS HRM</strong>
      <small>Human Resource Management</small>
    </span>
  </a>

  <button class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#hrmNavigation"
          aria-controls="hrmNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div id="hrmNavigation" class="collapse navbar-collapse">

    <ul class="navbar-nav ml-auto align-items-lg-center">

      <li class="nav-item">
        <a class="nav-link {% if request.url.path == '/hrm' %}active{% endif %}"
           href="/hrm">
          <i class="fas fa-th-large mr-1"></i>
          Dashboard
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/holidays' in request.url.path %}active{% endif %}" href="/hrm/holidays">
          <i class="fas fa-calendar-day mr-1"></i> Holidays
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/settings/masters' in request.url.path %}active{% endif %}" href="/hrm/settings/masters">
          <i class="fas fa-cogs mr-1"></i> HR Masters
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/settings/company' in request.url.path %}active{% endif %}" href="/hrm/settings/company">
          <i class="fas fa-building mr-1"></i> Company
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/employees' in request.url.path %}active{% endif %}"
           href="/hrm/employees">
          <i class="fas fa-users mr-1"></i>
          Employees
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/attendance' in request.url.path %}active{% endif %}"
           href="/hrm/attendance">
          <i class="fas fa-user-clock mr-1"></i>
          Attendance
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if '/leaves' in request.url.path %}active{% endif %}"
           href="/hrm/leaves">
          <i class="fas fa-calendar-alt mr-1"></i>
          Leaves
        </a>
      </li>

      <li class="nav-item"><a class="nav-link {% if '/payslips' in request.url.path %}active{% endif %}" href="/hrm/payslips"><i class="fas fa-file-invoice-dollar mr-1"></i> Payslips</a></li>

      <li class="nav-item ml-lg-2">
        <form method="post" action="/logout">
          <button type="submit" class="btn btn-link nav-link">
            <i class="fas fa-sign-out-alt mr-1"></i>
            Logout
          </button>
        </form>
      </li>

    </ul>

  </div>
</nav>

<main id="hrm-page-content" class="container-fluid py-4 px-lg-5">
  {% block content %}{% endblock %}
</main>

<iframe id="hrm-content-frame"
        class="hrm-content-frame"
        name="hrm-content-frame"
        title="HRM module content"></iframe>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  if (window.self !== window.top) {
    document.body.classList.add('hrm-embedded');
    return;
  }

  var frame = document.getElementById('hrm-content-frame');
  var page = document.getElementById('hrm-page-content');
  var moduleLinks = document.querySelectorAll('#hrmNavigation a.nav-link[href^="/hrm"]');

  function openModule(path) {
    page.hidden = true;
    frame.classList.add('is-active');
    frame.src = path;
    moduleLinks.forEach(function (link) {
      link.classList.toggle('active', link.getAttribute('href') === path ||
        (path !== '/hrm' && path.indexOf(link.getAttribute('href')) === 0));
    });
  }

  moduleLinks.forEach(function (link) {
    link.setAttribute('target', 'hrm-content-frame');
    link.addEventListener('click', function (event) {
      event.preventDefault();
      openModule(link.getAttribute('href'));
    });
  });

  frame.addEventListener('load', function () {
    try {
      var innerDocument = frame.contentDocument;
      if (innerDocument) {
        frame.style.height = Math.max(innerDocument.documentElement.scrollHeight,
          innerDocument.body ? innerDocument.body.scrollHeight : 0, 700) + 'px';
      }
    } catch (error) {
      frame.style.height = 'calc(100vh - 92px)';
    }
  });
}());
</script>

</body>
</html>
